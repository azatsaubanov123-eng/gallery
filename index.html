<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<title>Gallery</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">
<div class="bg-blobs"><div class="blob blob-1"></div><div class="blob blob-2"></div></div>

<!-- MAIN GALLERY -->
<div id="screen-grid" class="screen active">
  <div class="top">
    <h1>Медиатека</h1>
    <button class="icon-btn" id="btn-add" title="Загрузить">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
    </button>
  </div>
  <div class="filters">
    <button class="chip active" data-filter="all">Все</button>
    <button class="chip" data-filter="photo">Фото</button>
    <button class="chip" data-filter="video">Видео</button>
  </div>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty hidden">
    <svg viewBox="0 0 24 24" width="72" height="72" fill="currentColor" style="opacity:0.3"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
    <p>Пока пусто. Нажми <b>+</b> чтобы добавить фото или видео.</p>
  </div>
  <input type="file" id="file-input" accept="image/*,video/*" multiple style="display:none">
</div>

<!-- VIEWER -->
<div id="screen-view" class="screen viewer">
  <div class="viewer-top">
    <button class="icon-btn" id="btn-back">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </button>
    <div class="viewer-meta" id="viewer-meta"></div>
    <button class="icon-btn" id="btn-del">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
    </button>
  </div>
  <div class="viewer-stage" id="viewer-stage"></div>
  <div class="viewer-nav">
    <button class="nav-arrow" id="prev">‹</button>
    <div class="nav-counter" id="counter"></div>
    <button class="nav-arrow" id="next">›</button>
  </div>
</div>

<nav class="nav">
  <button class="nav-btn active" data-tab="grid">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M4 4h7v7H4V4zm9 0h7v7h-7V4zm-9 9h7v7H4v-7zm9 0h7v7h-7v-7z"/></svg>
    <span>Медиатека</span>
  </button>
  <button class="nav-btn" data-tab="albums">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M20 6h-8l-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2z"/></svg>
    <span>Альбомы</span>
  </button>
</nav>

<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
